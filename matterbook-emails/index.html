<title>matter book 고객 이메일</title>
<style>
* { box-sizing:border-box; }
html, body { margin:0; }
body { font-family:Inter,"Noto Sans KR",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; font-size:14px; background:#fff; color:#1f1f1f; transition:background .15s; }
body.dark { background:#1f1f1f; color:#e3e3e3; }
body.mobile-frame { background:#eceae6; }
body.mobile-frame.dark { background:#0f0f10; }

/* Controls */
.bar { position:sticky; top:0; z-index:5; background:#f6f5f2; border-bottom:1px solid #e2e0db; padding:10px 20px; display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; }
body.dark .bar { background:#2a2a2c; border-color:#3a3a3d; }
.bar h1 { font-size:15px; margin:0 8px 0 0; font-weight:700; white-space:nowrap; }
.group { display:flex; align-items:center; gap:6px; }
.group > span { font-size:12px; color:#6b6b6b; }
body.dark .group > span { color:#a5a5a8; }
.seg { display:inline-flex; border:1px solid #d6d3cc; border-radius:8px; overflow:hidden; background:#fff; }
body.dark .seg { border-color:#46464a; background:#1f1f1f; }
.seg button { font:inherit; font-size:13px; border:0; background:none; color:inherit; padding:6px 11px; cursor:pointer; white-space:nowrap; }
.seg button + button { border-left:1px solid #d6d3cc; }
body.dark .seg button + button { border-color:#46464a; }
.seg button[aria-pressed="true"] { background:#17243d; color:#fff; }
body.dark .seg button[aria-pressed="true"] { background:#a8c7fa; color:#062e6f; }
.switch { display:inline-flex; align-items:center; gap:8px; cursor:pointer; font:inherit; font-size:13px; background:none; border:0; color:inherit; padding:4px 0; }
.switch .track { width:38px; height:22px; border-radius:11px; background:#c9c6bf; position:relative; transition:background .15s; }
.switch .knob { position:absolute; top:3px; left:3px; width:16px; height:16px; border-radius:50%; background:#fff; transition:left .15s; }
.switch[aria-checked="true"] .track { background:#17243d; }
body.dark .switch[aria-checked="true"] .track { background:#a8c7fa; }
.switch[aria-checked="true"] .knob { left:19px; }

/* Mail app reading view */
.stage { padding:0; }
.mail { max-width:none; margin:0 auto; }
.mhead { padding:22px 28px 10px; }
.subject { font-size:22px; font-weight:400; margin:0 0 18px; line-height:1.35; display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
.label { font-size:12px; background:#e8e8e8; color:#444; padding:1px 6px; border-radius:4px; }
body.dark .label { background:#3c3c3f; color:#ccc; }
.sender { display:flex; gap:12px; align-items:flex-start; }
.avatar { width:40px; height:40px; border-radius:50%; background:#17243d; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:600; flex:none; font-size:16px; }
.who { flex:1; min-width:0; line-height:1.4; }
.who b { font-weight:600; }
.who .addr { color:#5f6368; font-size:12.5px; }
.who .to { color:#5f6368; font-size:12.5px; }
body.dark .who .addr, body.dark .who .to, body.dark .time { color:#a5a5a8; }
.time { color:#5f6368; font-size:12.5px; white-space:nowrap; }
.mbody { padding:4px 0 0; }
.mbody.desk { padding-left:52px; }
iframe { display:block; width:100%; border:0; height:900px; background:transparent; }

/* Phone (on a wide screen) */
.phone { width:390px; margin:24px auto 40px; background:#fff; border-radius:44px; border:10px solid #111; box-shadow:0 12px 40px rgba(0,0,0,.18); overflow:hidden; }
body.dark .phone { background:#1f1f1f; border-color:#000; box-shadow:0 12px 40px rgba(0,0,0,.6); }
.status { display:flex; justify-content:space-between; padding:12px 26px 4px; font-size:13px; font-weight:600; }
.appbar { display:flex; align-items:center; justify-content:space-between; padding:6px 14px 4px; font-size:20px; color:#444; }
body.dark .appbar { color:#ccc; }
.appbar .icons { display:flex; gap:18px; font-size:17px; }
.m .mhead { padding:8px 16px 8px; }
.m .subject { font-size:20px; margin-bottom:14px; }
.m .avatar { width:36px; height:36px; font-size:15px; }
.m .mbody { padding:0; }
@media (max-width:700px) {
  .bar { padding:10px 12px; gap:8px 12px; }
  .bar h1 { width:100%; }
  .group { max-width:100%; min-width:0; }
  .group > span { white-space:nowrap; }
  .seg { max-width:100%; overflow-x:auto; }
  .mhead { padding:16px 16px 8px; }
  .subject { font-size:20px; }
}
.home { height:5px; width:134px; background:#111; border-radius:3px; margin:10px auto 8px; opacity:.8; }
body.dark .home { background:#eee; }

te your client details form", "reminder.ko": "고객 정보 양식 작성을 다시 한번 안내드립니다", "ask.en": "We need some files from you again", "ask.ko": "파일을 다시 한번 보내 주시기 바랍니다", "ask-reminder.en": "A reminder about the files we asked for", "ask-reminder.ko": "요청드린 파일 업로드를 다시 한번 안내드립니다"};
const S = { kind:'engagement', lang:'ko', view: matchMedia('(max-width:700px)').matches ? 'mobile' : 'desktop', dark: false };
const T = {
  ko: { to:'나에게', time:'오전 10:42', inbox:'받은편지함' },
  en: { to:'to me', time:'10:42 AM', inbox:'Inbox' },
};
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function head() {
  const t = T[S.lang];
  return `<div class="mhead"><h2 class="subject">${esc(SUBJ[S.kind + '.' + S.lang])}<span class="label">${t.inbox}</span></h2>
    <div class="sender"><div class="avatar">J</div><div class="who"><b>JHP Lawyers Conveyancing Team</b> <span class="addr">&lt;conveyancing@jhplawyers.com.au&gt;</span><div class="to">${t.to} ▾</div></div><div class="time">${t.time}</div></div></div>`;
}
let ro;
function fit(f) {
  try {
    const d = f.contentDocument; if (!d || !d.body) return;
    f.style.height = '10px';
    f.style.height = Math.max(d.documentElement.scrollHeight, d.body.scrollHeight) + 'px';
  } catch (e) {}
}
function render() {
  const wide = !matchMedia('(max-width:700px)').matches;
  const framed = S.view === 'mobile' && wide;
  document.body.classList.toggle('dark', S.dark);
  document.body.classList.toggle('mobile-frame', framed);
  const desk = S.view === 'desktop';
  const mail = `<div class="mail ${desk ? '' : 'm'}">${head()}<div class="mbody ${desk && wide ? 'desk' : ''}"><iframe title="Email" sandbox="allow-same-origin"></iframe></div></div>`;
  const html = framed
    ? `<div class="phone"><div class="status"><span>9:41</span><span>●●● ▮</span></div><div class="appbar"><span>←</span><span class="icons"><span>⬇</span><span>🗑</span><span>✉</span><span>⋮</span></span></div>${mail}<div class="home"></div></div>`
    : mail;
  document.getElementById('stage').innerHTML = html;
  const f = document.querySelector('iframe');
  f.addEventListener('load', () => {
    fit(f);
    if (ro) ro.disconnect();
    try { ro = new ResizeObserver(() => fit(f)); ro.observe(f.contentDocument.body); } catch (e) {}
    setTimeout(() => fit(f), 200);
  });
  f.srcdoc = DOCS[S.kind + '.' + S.lang + (S.dark ? '.dark' : '')];
  for (const id of ['kind', 'lang', 'view']) document.querySelectorAll('#' + id + ' button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === S[id])));
  document.getElementById('dark').setAttribute('aria-checked', String(S.dark));
}
for (const id of ['kind', 'lang', 'view']) document.getElementById(id).addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; S[id] = b.dataset.v; render();
});
document.getElementById('dark').addEventListener('click', () => { S.dark = !S.dark; render(); });
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { const f = document.querySelector('iframe'); if (f) fit(f); }, 100); });
render();
</script>
